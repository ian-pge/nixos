[package]
name = "quickshell-update"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"
nix = { version = "0.31", features = ["signal", "process"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

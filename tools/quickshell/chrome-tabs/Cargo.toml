[package]
name = "quickshell-chrome-tabs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
nix = { version = "0.31", features = ["signal", "process"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

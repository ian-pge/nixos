[package]
name = "battery-relay-receiver"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true

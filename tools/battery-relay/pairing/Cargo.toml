[package]
name = "battery-relay-fastpair-setup"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fastpair-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
battery-relay-receiver = { path = "../receiver" }
bluer = { version = "=0.17.4", features = ["bluetoothd", "l2cap"] }
dbus = "0.9"
dbus-tokio = "0.7"
futures = "0.3"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
zeroize = "1"
